# 네이버 블로그 수집(pnpm data:collect) 을 정기 실행한다. 왜 Vercel Cron 이 아니라 Actions 인가 —
# 이 앱은 output: 'export' 라 부를 서버 함수가 없다. 부수효과로 이 잡이 Supabase 무료 티어의
# 7일 비활성 일시정지도 깨운다(docs/todo/02-collect-naver-blog.md).
name: 네이버 블로그 수집

on:
  schedule:
    # KST 화·금 06:00 (UTC 21:00, 전날 월·목)
    - cron: '0 21 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    name: blog_posts 수집
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
