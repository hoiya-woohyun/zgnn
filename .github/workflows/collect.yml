# 네이버 블로그 수집(pnpm data:collect) → AI 분석(data:analyze) → 승인된 후보 반영(data:apply) 을 정기 실행한다.
# 왜 Vercel Cron 이 아니라 Actions 인가 — 이 앱은 output: 'export' 라 부를 서버 함수가 없다. 부수효과로 이 잡이
# Supabase 무료 티어의 7일 비활성 일시정지도 깨운다(docs/todo/02-collect-naver-blog.md).
# 세 step 은 한 잡 안에서 순서대로 돈다. 수집·분석이 실패하면 잡은 빨갛게 되지만 반영(data:apply)은 그래도 돈다 — 사람이 승인한 것의
# 반영이 분석 장애에 막히지 않게(docs/todo/03-analyze-and-review.md). 시크릿은 각 step 에 필요한 것만 준다.
name: 블로그 수집 · 분석 · 반영

on:
  schedule:
    # KST 화·금 06:00 (UTC 21:00, 전날 월·목)
    - cron: '0 21 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    name: 수집 → 분석 → 반영
    runs-on: ubuntu-latest
    # 분석은 글 하나에 Claude 호출 한 번(수 초~수십 초). 기본 --limit 50 이면 30분 안에 넉넉히 끝난다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      # 03: Claude 는 API 키가 아니라 구독(setup-token)으로 부른다 — data:analyze 가 `claude -p` 를 자식 프로세스로 돌린다.
      # 그래서 Claude Code CLI 가 러너에 있어야 한다. 버전을 고정하는 이유는 서드파티 액션을 SHA 로 고정하는 것과 같다(docs/todo/05).
      - run: npm install -g @anthropic-ai/claude-code@2.1.278
      # 미분석 글을 분석해 candidates 를 만든다. KAKAO_REST_API_KEY 는 선택 — 시크릿이 비어 있으면 좌표 보강만 건너뛴다.
      # 글 단위 실패는 다음 실행에 재시도되므로 step 을 실패시키지 않는다(전부 실패·인증 실패일 때만 exit 1).
      # CLAUDE_CODE_OAUTH_TOKEN 은 로컬에서 `claude setup-token` 으로 만든 장기 토큰 — 구독 계정 그 자체라 GitHub Secrets 에만 둔다.
      - run: pnpm data:analyze
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      # 03: 사람이 Studio 에서 approved 로 바꾼 후보를 places 에 반영한다 — 빈 칸만 채우고, 신규는 draft.
      # 앞 step(수집·분석)이 빨갛게 돼도 돈다(!cancelled) — 사람이 승인한 것의 반영은 분석 장애와 무관하고, 막히면 장애 기간 내내 멈춘다.
      - run: pnpm data:apply
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
